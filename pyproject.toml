[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogy-research-workbench"
version = "0.3.0"
description = "Turn GEDCOM and OneTree exports into a private research workbench and a public family-history website"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICES.md"]
authors = [{name = "Mark Glasgow"}]
keywords = ["genealogy", "gedcom", "wikitree", "family-history", "static-site"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Repository = "https://github.com/glasgowm148/genealogy-research-workbench"
Documentation = "https://github.com/glasgowm148/genealogy-research-workbench#readme"
Issues = "https://github.com/glasgowm148/genealogy-research-workbench/issues"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff==0.11.13"]
browser = ["playwright==1.61.0"]

[project.scripts]
genealogy = "genealogy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genealogy = [
  "web/*",
  "starter/*",
  "starter/.gitignore",
  "starter/cases/*",
  "starter/skills/genealogy-research/*",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
