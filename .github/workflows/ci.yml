name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: make check PYTHON=python
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/genealogy init wheel-demo --name "Wheel smoke test"
          /tmp/wheel-check/bin/genealogy --project wheel-demo validate
          /tmp/wheel-check/bin/genealogy --project wheel-demo build
          test -f wheel-demo/dist/index.html
          test -f wheel-demo/dist/assets/site.js
          /tmp/wheel-check/bin/genealogy init import-demo --name "Wheel import"
          /tmp/wheel-check/bin/genealogy --project import-demo import "$GITHUB_WORKSPACE/examples/demo/input/family.ged" --publish-deceased --publish-reviewed-sources
          /tmp/wheel-check/bin/genealogy --project import-demo build
          test "$(ls import-demo/dist/people | wc -l)" = 42
          test -f import-demo/dist/data/site-data.js
          test -f import-demo/dist/data/public-tree.ged
      - name: Verify the source distribution ships examples and docs
        run: |
          tar -tzf dist/*.tar.gz | grep -q 'examples/demo/input/family.ged'
          tar -tzf dist/*.tar.gz | grep -q 'examples/demo/cases/demo.json'
          tar -tzf dist/*.tar.gz | grep -q 'docs/images/dossier.webp'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-save axe-core@4.10.2
      - run: make browser-check PYTHON=python
        env:
          GENEALOGY_AXE_PATH: node_modules/axe-core/axe.min.js
