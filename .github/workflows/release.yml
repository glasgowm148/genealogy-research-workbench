name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# no API token is stored in this repository. One-time setup on PyPI is
# described in docs/development.md ("Publishing a release").
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Check the version matches the release tag
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/release-check/bin/genealogy init release-demo --name "Release check"
          /tmp/release-check/bin/genealogy --project release-demo import "$GITHUB_WORKSPACE/examples/demo/input/family.ged" --publish-deceased
          /tmp/release-check/bin/genealogy --project release-demo build
          /tmp/release-check/bin/genealogy --project release-demo check-links
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
