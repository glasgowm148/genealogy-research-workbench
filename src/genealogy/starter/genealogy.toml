[project]
name = "Untitled genealogy research project"

[privacy]
# Public output excludes living, restricted, licensed and raw-DNA material.
# People with no recorded death count as living unless born more than this many
# years before the build year.
living_birth_years = 120

[storage]
# The one authoritative research database, and private files. Never publish these.
database = "private/research.sqlite"
assets = "private/assets"
backups = "private/backups"
exports = "private/exports"

# [storage.asset_roots]
# evidence = "evidence"   # files referenced where they are, checked by hash

[catalogue]
format = "html"
enabled = true
output = "catalogue.html"

[maps]
format = "html"
enabled = true
output = "places.html"

[timelines]
format = "html"
enabled = true
output = "timeline.html"

[exports]
# The public website. Built from the database's public projection only.
directory = "dist"

